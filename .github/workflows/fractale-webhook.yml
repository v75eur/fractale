name: Fractale Bot - Webhook

on:
  repository_dispatch:
    types: [run-fractale-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Fractale Bot
        env:
          NTFY_XAU: ${{ secrets.NTFY_XAU }}
          NTFY_EUR: ${{ secrets.NTFY_EUR }}
          NTFY_GBP: ${{ secrets.NTFY_GBP }}
          NTFY_V75: ${{ secrets.NTFY_V75 }}
        run: python bot.py
